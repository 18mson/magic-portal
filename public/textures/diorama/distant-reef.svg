      <stop offset="0%" stop-color="#4aa3a7" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#2c727d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#144b55" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d8f95" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1c5560" stop-opacity="0.95" />
