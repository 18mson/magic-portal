<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <defs>
    <linearGradient id="mantaBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#347b8e" />
      <stop offset="50%" stop-color="#235c6c" />
      <stop offset="100%" stop-color="#123d49" />
    </linearGradient>

    <linearGradient id="mantaBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf8f5" />
      <stop offset="60%" stop-color="#b6e7de" />
      <stop offset="100%" stop-color="#73c0b5" />
    </linearGradient>

    <linearGradient id="wingHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78d3c5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#46a39b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78d3c5" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Manta Tail -->
  <path d="M350,260 Q355,340 370,430 Q345,340 347,260 Z" fill="#123d49" opacity="0.95" />

  <!-- Main Manta Wings / Body -->
  <path d="M350,90 Q440,75 580,160 Q660,210 680,240 Q620,230 490,215 Q410,210 350,270 Q290,210 210,215 Q80,230 20,240 Q40,210 120,160 Q260,75 350,90 Z" fill="url(#mantaBody)" />

  <!-- Soft Wing Edge Highlights -->
  <path d="M350,90 Q440,75 580,160 Q660,210 680,240 Q620,230 490,215 M350,90 Q260,75 120,160 Q40,210 20,240 Q80,230 210,215" fill="none" stroke="url(#wingHighlight)" stroke-width="4" stroke-linecap="round" opacity="0.85" />

  <!-- Cephalic fins / horn flaps (front) -->
  <path d="M310,95 Q300,45 325,45 Q335,70 330,95 Z" fill="url(#mantaBelly)" />
  <path d="M390,95 Q400,45 375,45 Q365,70 370,95 Z" fill="url(#mantaBelly)" />

  <!-- Gentle back pattern spots ala Ghibli -->
  <g fill="#7ae4d0" opacity="0.7">
    <ellipse cx="350" cy="140" rx="6" ry="3" />
    <ellipse cx="320" cy="165" rx="7" ry="4" />
    <ellipse cx="380" cy="165" rx="7" ry="4" />
    <ellipse cx="280" cy="180" rx="8" ry="4" />
    <ellipse cx="420" cy="180" rx="8" ry="4" />
    <ellipse cx="350" cy="205" rx="10" ry="5" />
    <ellipse cx="335" cy="235" rx="5" ry="3" />
    <ellipse cx="365" cy="235" rx="5" ry="3" />
  </g>
</svg>
