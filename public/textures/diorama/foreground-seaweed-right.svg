  </defs>

  <!-- Seaweed stalk 1 (Right outer edge) -->
  <path d="M510,800 Q460,630 430,470 T480,250 Q430,120 380,40 Q420,120 440,260 T410,480 Q450,640 480,800 Z" fill="url(#kelpRight1)" opacity="0.95" />

  <!-- Seaweed stalk 2 (Curving in toward center) -->
