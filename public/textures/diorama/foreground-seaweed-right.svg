<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="500" height="800">
  <defs>
    <linearGradient id="kelpRight1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55c09e" />
      <stop offset="60%" stop-color="#287861" />
      <stop offset="100%" stop-color="#0f372c" />
    </linearGradient>

    <linearGradient id="kelpRight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84e7be" />
      <stop offset="50%" stop-color="#359877" />
      <stop offset="100%" stop-color="#144637" />
